<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Sign-In | M-Store ERP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            background: #ffffff;
            width: 100%;
            max-width: 450px;
        }

        .login-header {
            background: #1a252f;
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #dcdde1;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.2);
            border-color: #1e3c72;
        }

        .btn-login {
            background: #1e3c72;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            width: 100%;
        }

        .btn-login:hover {
            background: #2a5298;
            transform: translateY(-1px);
        }

        .brand-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #54a0ff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon">
                <i class="fa-solid fa-gears"></i>
            </div>
            <h3 class="fw-bold mb-1">M-Store ERP</h3>
            <p class="text-muted mb-0 text-light opacity-75">Mechanical Inventory & ERP System</p>
        </div>

        <div class="login-body">
            <!-- Flash notification handler -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Enterprise Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin" required autocomplete="username">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Secure Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn btn-login mb-3">
                    <i class="fa-solid fa-shield-halved me-2"></i> Authenticate Session
                </button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">Enterprise access only. All activities are recorded & audited.</small>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
